services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_DEFAULT_RELAYS: ${VITE_DEFAULT_RELAYS:-wss://relay.damus.io,wss://relay.nostr.band,wss://nos.lol}
        VITE_BLOSSOM_SERVER_URL: ${VITE_BLOSSOM_SERVER_URL:-http://localhost:3001}
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - strfry
      - blossom
    restart: unless-stopped

  strfry:
    build:
      context: ./infra/strfry
      dockerfile: Dockerfile
    ports:
      - "${STRFRY_PORT:-7777}:7777"
    volumes:
      - ${VOLUMES_PATH:-~/opt/docker/volumes-nostr}/strfry:/app/strfry-db
    restart: unless-stopped

  blossom:
    build:
      context: ./infra/blossom
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      PUBLIC_URL: ${BLOSSOM_PUBLIC_URL:-http://localhost:3001}
      MAX_UPLOAD_BYTES: ${BLOSSOM_MAX_UPLOAD_BYTES:-26214400}
      ALLOWED_PUBKEYS: ${BLOSSOM_ALLOWED_PUBKEYS:-}
    volumes:
      - ${VOLUMES_PATH:-~/opt/docker/volumes-nostr}/blossom:/data/uploads
    restart: unless-stopped
