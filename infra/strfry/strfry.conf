##
## strfry configuration for self-hosted Nostr relay
##
## Schema verified against ghcr.io/dockur/strfry:latest (strfry 1.1.0) by
## diffing against its /etc/strfry.conf.default. Keys are set explicitly
## rather than relying on strfry's compiled-in defaults, since the shipped
## default writePolicy plugin (/app/write-policy.py) is an unconfigured stub
## containing only placeholder pubkeys — inheriting it by omission would
## silently reject every write, not "allow everyone" as one might expect.
##

# Directory that contains the strfry LMDB database (restart required)
db = "/app/strfry-db"

# Event limits
events {
    maxEventSize = 65536
    rejectEventsNewerThanSeconds = 900
    rejectEventsOlderThanSeconds = 94608000  # 3 years
    rejectEphemeralEventsOlderThanSeconds = 60
    ephemeralEventsLifetimeSeconds = 300
    maxNumTags = 2000
    maxTagValSize = 1024
}

relay {
    # Interface to listen on. Use 0.0.0.0 to listen on all interfaces (restart required)
    bind = "0.0.0.0"

    # Port to open for the nostr websocket protocol (restart required)
    port = 7777

    # NIP-42 authentication — off by default to match this project's open,
    # self-hosted relay model. Turn on (and set serviceUrl) only if exposing
    # this relay beyond a trusted local network.
    auth {
        enabled = false
        serviceUrl = ""
    }

    info {
        name = "nostr-chat relay"
        description = "Self-hosted strfry relay for nostr-chat"
        pubkey = ""  # optional: hex pubkey of relay operator
        contact = "" # optional: contact email
    }

    # Maximum accepted incoming websocket frame size (should be larger than max event) (restart required)
    maxWebsocketPayloadSize = 131072

    # Websocket-level PING frequency, in seconds (restart required)
    autoPingSeconds = 55

    # Explicitly disabled: the image's default plugin path
    # (/app/write-policy.py) only contains placeholder pubkeys and would
    # reject every write if left unset. Anyone can currently publish — fine
    # for a relay kept behind a firewall/local network; write a real
    # allowlist plugin before exposing this relay publicly.
    writePolicy {
        plugin = ""
    }
}
